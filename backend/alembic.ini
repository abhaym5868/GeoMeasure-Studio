# Alembic configuration file
# This file is read by `alembic` CLI commands.
# The [alembic] section is required; all other sections are optional.

[alembic]
# Path to the migrations directory
script_location = migrations

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path modifications
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Maximum length for the 'slug' portion of migration filenames
truncate_slug_length = 40

# The database URL is read from the DATABASE_URL_SYNC environment variable
# via env.py — it is NOT hardcoded here.
# We use the SYNC url (psycopg2) because Alembic does not support asyncpg directly.
sqlalchemy.url = postgresql+psycopg2://geomeasure:geomeasure_dev@localhost:5432/geomeasure_db

[post_write_hooks]
# No post-write hooks configured yet.
# You could add 'ruff format' here to auto-format migration files.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
